<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>discord.gg/orr</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; }

        body {
            background: #000 url('https://i.pinimg.com/originals/51/ae/a3/51aea3393b8234a1e69d8713a0a58bc3.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: Tahoma, 'Trebuchet MS', Arial, sans-serif;
            color: #eee;
            overflow: hidden;
            padding: 2.5vh 2.5vw;
        }
        body::before {
            content: '';
            position: fixed; inset: 0;
            background:
                repeating-linear-gradient(45deg, rgba(0,0,0,.25) 0 2px, transparent 2px 4px),
                rgba(0,0,0,.72);
            z-index: 0;
        }

        .wrap { position: relative; z-index: 1; width: 100%; height: 100%; display: flex; flex-direction: column; }

        /* ===== الهيدر اللامع ===== */
        .header {
            direction: ltr;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.4vh 2vw;
            border: 1px solid #2a0000;
            border-bottom: 3px solid #560000;
            border-radius: 12px 12px 0 0;
            background: linear-gradient(#ff4a3d 0%, #d60d0d 49%, #a30000 50%, #cf0a0a 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 6px 18px rgba(0,0,0,.7);
        }
        .logo { display: flex; align-items: baseline; gap: 1.2vw; }
        .logo b {
            font: normal 7.5vh/1 Impact, 'Arial Black', sans-serif;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 1px 0 #e6e6e6, 0 2px 0 #c9c9c9, 0 3px 0 #a8a8a8, 0 4px 0 #888, 0 8px 10px rgba(0,0,0,.55);
        }
        .logo small { font-size: 2.3vh; font-weight: bold; color: #ffd0d0; text-shadow: 0 1px 1px #500; }

        .badge {
            font: normal 4.2vh/1 Impact, 'Arial Black', sans-serif;
            padding: 1.2vh 1.8vw;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 40px;
            background: linear-gradient(#333, #000);
            text-shadow: 0 -1px 0 #000;
            box-shadow: 0 0 0 2px #600, inset 0 1px 0 rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.6);
        }

        /* ===== اللوحة: عمودين يملأون الشاشة ===== */
        .panel {
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3vw;
            align-items: center;
            padding: 3vh 3vw;
            border: 1px solid #000;
            border-top: 0;
            border-radius: 0 0 12px 12px;
            background:
                linear-gradient(rgba(255,255,255,.06), rgba(255,255,255,0) 90px),
                repeating-linear-gradient(45deg, #1b1b1b 0 2px, #101010 2px 4px);
            box-shadow: inset 0 0 40px rgba(0,0,0,.8), 0 14px 30px rgba(0,0,0,.8);
        }
        .col { min-width: 0; min-height: 0; }

        /* صورة على شكل بولارويد */
        .image-container {
            padding: 1.4vh 1.4vh 5vh;
            background: #f3f3f3;
            border-radius: 3px;
            transform: rotate(-1.4deg);
            box-shadow: 0 8px 20px rgba(0,0,0,.85), 0 0 0 1px #999;
        }
        .image-container img {
            display: block;
            width: 100%;
            height: 58vh;
            object-fit: cover;
            border: 1px solid #777;
        }

        /* فقاعة الكلام */
        .text {
            position: relative;
            padding: 2.4vh 1.6vw;
            font-size: 3.6vh;
            font-weight: bold;
            line-height: 1.6;
            text-align: center;
            color: #fff;
            text-shadow: 0 -1px 0 rgba(0,0,0,.6);
            border: 2px solid #3d0000;
            border-radius: 14px;
            background: linear-gradient(#ee2b2b 0%, #b80000 50%, #8f0000 51%, #b30000 100%);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 5px 12px rgba(0,0,0,.7);
        }
        .text::after {
            content: '';
            position: absolute; top: 100%; right: 60px;
            border: 14px solid transparent;
            border-top-color: #8f0000;
            filter: drop-shadow(0 3px 2px rgba(0,0,0,.6));
        }

        /* معلومات IP */
        .info {
            margin-top: 4vh;
            max-height: 26vh;
            padding: 1.6vh 1vw;
            font: 2vh/1.5 'Courier New', Courier, monospace;
            color: #ff7a7a;
            white-space: pre-wrap;
            text-align: left;
            direction: ltr;
            overflow: hidden;
            background: linear-gradient(#050505, #140000);
            border: 1px solid #000;
            border-radius: 6px;
            box-shadow: inset 0 3px 8px #000, 0 1px 0 rgba(255,255,255,.18);
        }
        .info::before {
            content: 'root@orbit:~# whoami\A';
            white-space: pre;
            display: block;
            color: #fff;
            margin-bottom: 4px;
        }

        /* زر الديسكورد اللامع */
        .footer-text {
            position: relative;
            display: block;
            margin-top: 3.4vh;
            padding: 1.8vh 10px;
            overflow: hidden;
            font: normal 5.2vh/1.2 Impact, 'Arial Black', sans-serif;
            letter-spacing: 1px;
            text-align: center;
            text-decoration: none;
            direction: ltr;
            color: #fff;
            text-shadow: 0 -2px 0 rgba(0,0,0,.55);
            border: 2px solid #3d0000;
            border-radius: 60px;
            background: linear-gradient(#ff6a4d, #e01212 50%, #b30000 51%, #d80d0d);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 6px 0 #5a0000, 0 12px 16px rgba(0,0,0,.7);
        }
        .footer-text::before {
            content: '';
            position: absolute; left: 0; right: 0; top: 0; height: 50%;
            background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.05));
            border-radius: 60px 60px 0 0;
        }
        .footer-text:hover { filter: brightness(1.12); }
        .footer-text:active { transform: translateY(4px); box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 2px 0 #5a0000; }

        /* شريط التحميل */
        .loader {
            margin-top: 4vh;
            height: 3.4vh;
            padding: 3px;
            background: linear-gradient(#000, #2a2a2a);
            border: 1px solid #000;
            border-radius: 14px;
            box-shadow: inset 0 2px 5px #000, 0 1px 0 rgba(255,255,255,.2);
            overflow: hidden;
        }
        .loader-bar {
            height: 100%;
            width: 0%;
            border-radius: 10px;
            background:
                repeating-linear-gradient(-45deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px),
                linear-gradient(#ff5a4a, #c50000 50%, #900000 51%, #c50000);
            background-size: 28px 28px, 100% 100%;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
            animation: load 5s infinite, barber 0.8s linear infinite;
        }
        @keyframes load { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes barber { to { background-position: 28px 0, 0 0; } }

        /* احتياط للشاشات الصغيرة/الطولية فقط */
        @media (max-width: 800px), (max-aspect-ratio: 1/1) {
            body { overflow: auto; }
            .wrap { height: auto; min-height: 100%; }
            .panel { grid-template-columns: 1fr; }
            .image-container img { height: 34vh; }
        }
        @media (prefers-reduced-motion: reduce) { .loader-bar { animation: none; width: 100%; } }
    </style>
</head>
<body>
 
    <div class="wrap"> 

        <div class="header">
            <div class="logo"><b>Orbit</b><small>server: Orbit</small></div>
            <div class="badge">gg./orr</div>
        </div>

        <div class="panel">

            <div class="col">
            <!-- الصورة الرئيسية -->
            <div class="image-container">
                <img src="https://i.pinimg.com/736x/d2/1b/18/d21b188fe08b5db87cf0adf939959251.jpg" alt="Discord Image">
            </div>
            </div>

            <div class="col">
            <!-- النص العربي -->
            <div class="text">تريد الاداة  تعال للدسكورددد سريععععع اختصارنا تحت</div>

            <!-- معلومات IP -->
            <div class="info" id="ip-info">Loading data...</div>

            <!-- النص السفلي -->
            <a class="footer-text" href="https://discord.gg/orr">discord.gg/orr</a>

            <!-- شريط التحميل -->
            <div class="loader">
                <div class="loader-bar"></div>
            </div>
            </div>

        </div>
    </div>

    <!-- الموسيقى الخلفية (رابط خارجي يعمل مباشرة) -->
    <audio id="bg-music" autoplay loop>
        <source src="https://i.top4top.io/m_3923wu4jw1.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==================== جلب معلومات IP ====================
        fetch('https://ipinfo.io/json')
            .then(response => response.json())
            .then(data => {
                delete data.readme;
                const infoDiv = document.getElementById('ip-info');
                infoDiv.textContent = JSON.stringify(data, null, 2);
            })
            .catch(err => {
                document.getElementById('ip-info').textContent = 'Error loading IP info';
            });

        // ==================== تشغيل الموسيقى عند أول نقرة ====================
        const audio = document.getElementById('bg-music');
        
        document.body.addEventListener('click', () => {
            audio.play().catch(e => console.log('Autoplay blocked'));
        }, { once: true });

        // محاولة التشغيل الفوري
        window.addEventListener('load', () => {
            audio.volume = 0.5;
            audio.play().catch(e => console.log('Autoplay blocked by browser'));
        });

        // ==================== تأثير إضافي: كتابة الاسم ====================

        // هاذا التريقر
        //<meta http-equiv="refresh" content="0;url=رابط">

        const title = document.title;
        let i = 0;
        setInterval(() => {
            document.title = title.substring(0, i) + ' | ' + title.substring(i);
            i = (i + 1) % title.length;
        }, 200);
    </script>

</body>
</html>
